{% extends 'base-topics.html' %}

{% block title %} — Entrar {% endblock %}

{% block content %}
<section class="w-full max-w-md px-4 py-16 mx-auto">
    <h1 class="mb-6 text-3xl font-bold text-center text-gray-900 dark:text-white">Entrar</h1>
    <form method="post" class="p-6 space-y-4 bg-white border border-gray-200 rounded-2xl dark:bg-gray-800 dark:border-gray-700">
        {% csrf_token %}
        {% if form.non_field_errors %}
        <div class="p-3 text-sm text-red-700 bg-red-100 rounded-lg dark:bg-red-900 dark:text-red-200">
            {{ form.non_field_errors }}
        </div>
        {% endif %}
        <div>
            <label class="block mb-1 text-sm text-gray-700 dark:text-gray-300">Usuário</label>
            {{ form.username }}
        </div>
        <div>
            <label class="block mb-1 text-sm text-gray-700 dark:text-gray-300">Senha</label>
            {{ form.password }}
        </div>
        <button type="submit" class="w-full px-4 py-2 font-medium text-white bg-blue-600 rounded-lg hover:bg-blue-700">
            Entrar
        </button>
    </form>
    <p class="mt-4 text-sm text-center text-gray-600 dark:text-gray-300">
        Não tem conta?
        <a href="{% url 'registro' %}" class="text-blue-600 hover:underline">Registrar</a>
    </p>
</section>
{% endblock %}
